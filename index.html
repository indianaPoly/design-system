<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design System Preview</title>
    <script type="module" crossorigin src="/design-system/assets/index-CFL4g5V6.js"></script>
    <link rel="stylesheet" crossorigin href="/design-system/assets/index-BUd_6FFT.css">
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <p class="eyebrow">Design System Preview</p>
        <h1>토큰과 컴포넌트 갤러리</h1>
        <p class="lead">
          색상 토큰과 각 컴포넌트를 로컬에서 바로 확인할 수 있도록 구성한
          미니 프리뷰입니다. 컴포넌트는 선택된 항목만 렌더링해서 DOM 부하를
          줄입니다.
        </p>
      </header>

      <main class="page-content">
        <section class="panel" id="tokens">
          <div class="panel-header">
            <h2>색상 토큰</h2>
            <p>기본 테마 색상 토큰을 한 눈에 확인할 수 있습니다.</p>
          </div>
          <div class="token-grid" id="color-grid"></div>
        </section>

        <section class="panel" id="components">
          <div class="panel-header">
            <h2>컴포넌트 프리뷰</h2>
            <p>선택한 컴포넌트만 렌더링해서 성능을 최적화합니다.</p>
          </div>
          <div class="component-controls">
            <label for="component-select">컴포넌트 선택</label>
            <select id="component-select" aria-label="컴포넌트 선택"></select>
            <p class="helper" id="component-description"></p>
          </div>
          <div class="component-demo" id="component-demo"></div>
        </section>
      </main>
    </div>

  </body>
</html>
