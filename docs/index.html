<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design System Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <p class="eyebrow">Design System Preview</p>
        <h1>더 단정하고 읽기 쉬운 기본 UI</h1>
        <p class="lead">
          검은색, 흰색, 회색을 중심으로 다시 정리한 토큰과 컴포넌트를 한 곳에서 확인할 수 있는
          미니 프리뷰입니다. 과한 장식보다 정보 구조와 사용 흐름이 먼저 보이도록 구성했습니다.
        </p>
      </header>

      <main class="page-content">
        <section class="panel" id="tokens">
          <div class="panel-header">
            <h2>색상 토큰</h2>
            <p>모노톤 베이스 위에서 대비와 밀도로 위계를 만드는 핵심 토큰들입니다.</p>
          </div>
          <div class="token-grid" id="color-grid"></div>
        </section>

        <section class="panel" id="components">
          <div class="panel-header">
            <h2>컴포넌트 프리뷰</h2>
            <p>실제 서비스 화면에 가까운 문구와 상태로 새 스타일을 빠르게 확인할 수 있습니다.</p>
          </div>
          <div class="component-controls">
            <label for="component-select">컴포넌트 선택</label>
            <select id="component-select" aria-label="컴포넌트 선택"></select>
            <div class="component-toolbar">
              <ds-button id="theme-toggle" variant="secondary" size="sm">Dark</ds-button>
            </div>
            <p class="helper" id="component-description"></p>
          </div>
          <div class="component-demo" id="component-demo"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
