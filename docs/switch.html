<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design System - Switch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Switch</h1>
        <p class="lead">Switches toggle the state of a single setting on or off.</p>
      </header>
      <section class="usage-section">
        <h2 class="usage-section">Usage</h2>
        <div class="component-preview">
          <div class="demo-stack">
            <ds-switch checked>Notifications</ds-switch>
            <ds-switch>Dark Mode</ds-switch>
          </div>
        </div>
        <div class="code-block-header">
          <span class="code-block-title">HTML</span>
          <button class="copy-button">Copy</button>
        </div>
        <pre><code>&lt;ds-switch checked&gt;Notifications&lt;/ds-switch&gt;
&lt;ds-switch&gt;Dark Mode&lt;/ds-switch&gt;</code></pre>
      </section>
    </main>
    <script type="module" src="./src/shared-layout.ts"></script>
  </body>
</html>
